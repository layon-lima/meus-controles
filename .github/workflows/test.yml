name: Verificar Central de Controles
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe Python
        run: python -m compileall -q app.py truck.py truck_workflow.py controller/server.py tests
      - name: Executar testes de servidor, calculos e painel web
        run: python -m unittest discover -s tests -v
      - name: Validar JavaScript
        run: |
          node --check static/app.js
          node --check static/truck.js
          node --check static/truck_workflow.js
