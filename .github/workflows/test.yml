name: Verificar Central de Controles
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe Python
        run: python -m compileall -q app.py truck.py truck_workflow.py debt.py open_debt.py debt_import.py receiving.py receiving_import.py pair.py pair_records.py control_types.py controller/server.py tests
      - name: Executar testes de servidor, calculos e painel web
        run: python -m unittest discover -s tests -v
      - name: Validar JavaScript
        run: |
          node --check static/app.js
          node --check static/truck.js
          node --check static/truck_workflow.js
          node --check static/debt.js
          node --check static/open_debt.js
          node --check static/receiving.js
          node --check static/pair.js
          node --check static/pair_records.js
          node --check static/control_types.js
          node --check static/receiving_import.js
          node --check tests/test_navigation.js
          node --check tests/test_folder_move.js
          node --check tests/test_pair_payments.js
          node tests/test_pair_payments.js
          node --check tests/test_pair_records_ui.js
          node tests/test_pair_records_ui.js
          node tests/test_folder_move.js
          node tests/test_navigation.js
