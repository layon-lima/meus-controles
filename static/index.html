<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14263b">
  <title>Central de Controles</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/truck.css">
  <link rel="stylesheet" href="/static/truck_workflow.css">
  <link rel="stylesheet" href="/static/debt.css">
  <link rel="stylesheet" href="/static/receiving.css">
  <link rel="stylesheet" href="/static/receiving_import.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#logo"></use></svg></span>
        <span><strong>MEUS CONTROLES</strong><small>Central de gestão</small></span>
      </div>
      <div class="sidebar-section-label">GERENCIAMENTO</div>
      <button class="nav-link active" id="homeLink" onclick="App.navigate('home')"><span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#dashboard"></use></svg></span> Visão geral</button>
      <div class="sidebar-section-label">MEUS QUADROS</div>
      <button type="button" class="sidebar-create-board" onclick="App.newBoard()"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#plus"></use></svg> Novo quadro</button>
      <div id="sideBoards" class="sidebar-items"></div>
      <div class="sidebar-bottom">
        <div class="sidebar-version"><span class="status-dot"></span> Servidor local <span class="version">v1.0</span></div>
      </div>
    </aside>
    <div class="mobile-shade" onclick="App.toggleMenu(false)" id="mobileShade"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-button mobile-menu" aria-label="Abrir menu" onclick="App.toggleMenu(true)"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#menu"></use></svg></button>
          <div><div class="breadcrumbs" id="crumb">CENTRAL / VISÃO GERAL</div><h1 id="pageTitle">Visão geral</h1></div>
        </div>
        <div class="top-actions">
          <div class="search-wrap"><label class="search"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#search"></use></svg><input type="search" autocomplete="off" spellcheck="false" aria-label="Pesquisar controles ou quadros com Q" aria-controls="searchResults" aria-expanded="false" id="search" placeholder="Controle ou Q quadro..." onfocus="App.search(this.value)" oninput="App.search(this.value)" onkeydown="App.searchKeydown(event)"></label><div id="searchResults" class="search-results" aria-label="Resultados da pesquisa" onkeydown="App.searchResultKeydown(event)" hidden></div></div>
          <button class="btn btn-primary" onclick="App.newControl()"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#plus"></use></svg> <span class="hide-small">Novo controle</span></button>
        </div>
      </header>
      <main id="main" class="main"><div class="empty-state">Carregando controles...</div></main>
      <footer>Central de Controles · Dados salvos neste computador · <span id="footerClock"></span></footer>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
  <script src="/static/truck.js" defer></script>
  <script src="/static/truck_workflow.js" defer></script>
  <script src="/static/debt.js" defer></script>
  <script src="/static/receiving.js" defer></script>
  <script src="/static/receiving_import.js" defer></script>
</body>
</html>
