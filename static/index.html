  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/pwa-icon-192.png">
  <title>Central de Controles</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/truck.css?v=20261022-data-livre-v4">
  <link rel="stylesheet" href="/static/truck_workflow.css?v=20261022-conferencia-1">
  <link rel="stylesheet" href="/static/debt.css?v=20261022-conferencia-1">
  <link rel="stylesheet" href="/static/open_debt.css?v=20261022-conferencia-1">
  <link rel="stylesheet" href="/static/receiving.css?v=20261027-pedidos-pdf-ocr-selecao-v11">
  <link rel="stylesheet" href="/static/pair.css?v=20261022-conferencia-1">

  <link rel="stylesheet" href="/static/control_types.css">
  <link rel="stylesheet" href="/static/receiving_import.css">
  <link rel="stylesheet" href="/static/receiving_pdf.css?v=20261027-pedidos-pdf-ocr-selecao-v11">
  <!-- Regras exclusivas do desktop, carregadas por ultimo sobre os modulos. -->
  <link rel="stylesheet" href="/static/desktop_compact.css?v=20261022-conferencia-1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#logo"></use></svg></span>
        <span><strong>MEUS CONTROLES</strong><small>Central de gestão</small></span>
      </div>
      <div class="sidebar-section-label">GERENCIAMENTO</div>
      <button class="nav-link active" id="homeLink" onclick="App.navigate('home')"><span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#dashboard"></use></svg></span> Visão geral</button>
      <div class="sidebar-section-label">MINHAS PASTAS</div>
      <button type="button" class="sidebar-create-board" onclick="App.newBoard()"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#plus"></use></svg> Nova pasta</button>
      <div id="sideBoards" class="sidebar-items"></div>
      <div class="sidebar-bottom">
        <div class="sidebar-version"><span class="status-dot"></span> Servidor conectado <span class="version">v1.0</span></div>
      </div>
    </aside>
    <div class="mobile-shade" onclick="App.toggleMenu(false)" id="mobileShade"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-button mobile-menu" aria-label="Abrir menu" onclick="App.toggleMenu(true)"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#menu"></use></svg></button>
          <div class="page-nav-arrows" role="group" aria-label="Navegação entre páginas">
            <button type="button" class="page-nav-arrow page-nav-back" id="navBack" title="Voltar à página anterior" aria-label="Voltar à página anterior" onclick="App.goBack()" disabled><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#arrow-right"></use></svg></button>
            <button type="button" class="page-nav-arrow page-nav-forward" id="navForward" title="Avançar para a próxima página" aria-label="Avançar para a próxima página" onclick="App.goForward()" disabled><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#arrow-right"></use></svg></button>
          </div>
          <div><div class="breadcrumbs" id="crumb">CENTRAL / VISÃO GERAL</div><h1 id="pageTitle">Visão geral</h1></div>
        </div>
        <div class="top-actions">
          <div class="search-wrap"><label class="search"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#search"></use></svg><input type="search" autocomplete="off" spellcheck="false" aria-label="Pesquisar controles ou pastas com P" aria-controls="searchResults" aria-expanded="false" id="search" placeholder="Controle ou P pasta..." onfocus="App.search(this.value)" oninput="App.search(this.value)" onkeydown="App.searchKeydown(event)"></label><div id="searchResults" class="search-results" aria-label="Resultados da pesquisa" onkeydown="App.searchResultKeydown(event)" hidden></div></div>
          <button id="changeCurrentControlType" type="button" class="btn btn-quiet btn-sm" onclick="App.changeControlTypeForm(App.s.id)" hidden><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#settings"></use></svg><span class="hide-small">Alterar tipo</span></button>
          <button id="moveCurrentControl" type="button" class="btn btn-quiet btn-sm" onclick="App.moveControlForm(App.s.id)" hidden><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#folder"></use></svg><span class="hide-small">Mover para pasta</span></button>
          <button class="btn btn-primary" onclick="App.newControl()"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#plus"></use></svg> <span class="hide-small">Novo controle</span></button>
        </div>
      </header>
      <div id="connectionStatus" class="connection-status" role="status" hidden></div>
      <main id="main" class="main"><div class="empty-state">Carregando controles...</div></main>
      <footer>Central de Controles · Dados salvos no servidor configurado · <span id="footerClock"></span></footer>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=20261026-vales-v1" defer></script>
  <script src="/static/truck.js?v=20261022-comissao-v7" defer></script>
  <script src="/static/truck_workflow.js?v=20261022-conferencia-1" defer></script>
  <script src="/static/debt.js?v=20261022-conferencia-1" defer></script>
  <script src="/static/open_debt.js?v=20261022-conferencia-1" defer></script>
  <script src="/static/receiving.js?v=20261027-pedidos-pdf-ocr-selecao-v11" defer></script>
  <script src="/static/pair.js?v=20261022-conferencia-1" defer></script>
  <script src="/static/pair_records.js?v=acerto-misto-formulario-20261014" defer></script>
  <script src="/static/pair_financial_import.js?v=acerto-misto-formulario-20261014" defer></script>
  <script src="/static/vales.js?v=20261026-vales-v5" defer></script>
  <script src="/static/control_types.js" defer></script>
  <script src="/static/receiving_import.js" defer></script>
  <script src="/static/receiving_pdf.js?v=20261027-pedidos-pdf-ocr-selecao-v11" defer></script>
  <script src="/static/pwa.js" defer></script>
</body>
</html>
