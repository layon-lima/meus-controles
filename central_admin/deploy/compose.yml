name: central-novo-horizonte

services:
  painel:
    build:
      context: ../..
      dockerfile: central_admin/deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CENTRAL_BIND: "0.0.0.0"
      CENTRAL_ALLOW_CONTAINER_BIND: "1"
      CENTRAL_PORT: "18771"
      CENTRAL_CONTAS_DB: "/contas-data/controle_contas.db"
    volumes:
      - type: bind
        source: /opt/apps/contas-runtime/data
        target: /contas-data
        # A pasta SQLite do CONTAS pode ser 0700/root; o container so recebe bind RO,
    # filesystem RO, nenhuma capability e nenhuma rota de escrita.
    user: "0:0"
    read_only: true
        bind:
          create_host_path: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:18771:18771"
    networks:
      controles_db: {}
      interface_web:
        aliases:
          - central-nh

networks:
  controles_db:
    external: true
    name: meus-controles_banco_privado

  interface_web:
    external: true
    name: meus-controles_interface_web
