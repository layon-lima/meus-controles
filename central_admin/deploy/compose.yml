name: central-novo-horizonte

services:
  painel:
    build:
      context: ../..
      dockerfile: central_admin/deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CENTRAL_BIND: "0.0.0.0"
      CENTRAL_ALLOW_CONTAINER_BIND: "1"
      CENTRAL_PORT: "18771"
      # Libera painel de CONSULTA sem chave no navegador.
      # A rota e publica enquanto o Caddy nao tiver um controle de acesso externo.
      CENTRAL_PUBLIC_READ: "1"
      CENTRAL_OPERATIONS_ENABLED: "${CENTRAL_OPERATIONS_ENABLED:-0}"
      CENTRAL_CONTROLES_UPSTREAM: "http://central-controles-api:18765"
      CENTRAL_CONTAS_UPSTREAM: "http://contas-web:8767"
      CENTRAL_CONTAS_ORIGIN: "${CENTRAL_CONTAS_ORIGIN:-https://contas-cloud.fazendanovohorizonte.com}"
      CENTRAL_CONTROLES_ORIGIN: "https://controles.fazendanovohorizonte.com"
      CENTRAL_PUBLIC_ORIGIN: "https://controles.fazendanovohorizonte.com"
      CENTRAL_CONTAS_DB: "/contas-data/controle_contas.db"
    volumes:
      - type: bind
        source: /opt/apps/contas-runtime/data
        target: /contas-data
        read_only: true
        bind:
          create_host_path: false
    # O banco do CONTAS pode ter permissoes root-only. O bind e RO,
    # o filesystem do container e RO e todas as capabilities sao removidas.
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:18771:18771"
    networks:
      controles_db: {}
      contas_privada: {}
      interface_web:
        aliases:
          - central-nh

networks:
  contas_privada:
    external: true
    name: contas-web-original_default
  controles_db:
    external: true
    name: meus-controles_banco_privado
  interface_web:
    external: true
    name: meus-controles_interface_web
