<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Controles</title>
<style>
*{box-sizing:border-box} :root{--bg:#f4f7fb;--ink:#172033;--muted:#718096;--line:#e5eaf1;--blue:#2563eb;--shadow:0 12px 35px rgba(26,39,68,.08)}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-rows:auto 1fr 58px}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;z-index:5}
.brand{font-size:20px;font-weight:800;white-space:nowrap}.search{flex:1;max-width:620px;margin-left:auto;background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e9eef8;color:#26324a}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fff0f0;color:#b42318}
main{min-height:0;overflow:auto;padding:18px 20px 26px}.titlebar{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.titlebar h1{font-size:25px;margin:0}.titlebar p{margin:4px 0 0;color:var(--muted);font-size:13px}
.board{display:flex;gap:16px;align-items:flex-start;min-height:calc(100vh - 175px);padding-bottom:18px}
.column{width:clamp(310px,27vw,410px);min-width:310px;background:#eaf1ff;border:1px solid #d8e4fa;border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.column.dragging{opacity:.5}.colhead{display:flex;align-items:center;gap:9px;padding:4px 4px 12px}.dot{width:10px;height:10px;border-radius:50%;background:#3b82f6}.colhead strong{font-size:15px}.count{font-size:11px;color:#64748b;background:#fff;padding:3px 7px;border-radius:99px}.more{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer}
.cards{display:grid;gap:10px;min-height:80px}.card{background:#fff;border:1px solid #e3e9f2;border-radius:15px;padding:15px;box-shadow:0 4px 14px rgba(26,39,68,.06);cursor:pointer}.card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(26,39,68,.1)}.card.dragging{opacity:.45}.cardtop{display:flex;gap:8px;align-items:flex-start}.card h3{margin:0;font-size:15px;flex:1}.pill{font-size:10px;font-weight:800;background:#eef2ff;color:#4f46e5;border-radius:99px;padding:4px 7px}.party{font-size:12px;color:#64748b;margin:5px 0 14px}.balance{font-size:21px;font-weight:850}.label{font-size:10px;color:#7b8798;text-transform:uppercase;letter-spacing:.06em}.progress{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:9px 0 7px}.progress i{display:block;height:100%;background:#2563eb}.meta{display:flex;justify-content:space-between;font-size:11px;color:#64748b}.add{width:100%;border:1px dashed #9fb4d8;background:rgba(255,255,255,.55);border-radius:12px;padding:10px;color:#476386;font-weight:700;cursor:pointer;margin-top:10px}
nav{background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:42px}nav button{border:0;background:none;color:#7b8798;font-size:12px;cursor:pointer}nav button.active{color:#2563eb;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw;z-index:20}.modal.open{display:flex}.panel{width:min(1500px,96vw);height:min(900px,94vh);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.2);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}.panelhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.panelhead h2{margin:0;font-size:20px}.x{margin-left:auto;border:0;background:#f2f4f7;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 22px;border-bottom:1px solid var(--line)}.stat{background:#f7f9fc;border:1px solid #edf0f4;border-radius:13px;padding:11px 13px}.stat b{display:block;font-size:17px;margin-top:3px}.content{overflow:auto;padding:0 22px 20px}.table{width:100%;border-collapse:separate;border-spacing:0 7px}.table th{text-align:left;font-size:10px;color:#7b8798;text-transform:uppercase;padding:8px}.table td{background:#f8fafc;border-top:1px solid #edf1f5;border-bottom:1px solid #edf1f5;padding:10px 8px;font-size:12px}.table td:first-child{border-left:1px solid #edf1f5;border-radius:10px 0 0 10px}.table td:last-child{border-right:1px solid #edf1f5;border-radius:0 10px 10px 0}.money{font-weight:800}.actions{display:flex;gap:5px}.mini{border:0;background:#e9eef8;border-radius:8px;padding:6px 8px;cursor:pointer}.mini.del{background:#feecec;color:#b42318}.foot{border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:flex-end;gap:8px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px;overflow:auto}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800;color:#526071}.field input,.field select,.field textarea{border:1px solid #dfe5ed;border-radius:10px;padding:10px;outline:none}.span2{grid-column:span 2}.empty{padding:30px;text-align:center;color:#8a96a8}
@media(max-width:800px){header{height:60px;padding:8px 10px}.brand{font-size:16px}.search{display:none}.board{gap:10px}.column{min-width:86vw}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.panel{width:100vw;height:100vh;border-radius:0}.app{grid-template-rows:auto 1fr 52px}nav{gap:25px}}
</style></head>
<body><div class="app">
<header><div class="brand">Meus Controles</div><input id="search" class="search" placeholder="Buscar controles..."><button class="btn" onclick="newBoard()">+ Novo quadro</button><button class="btn primary" onclick="newControl()">+ Novo controle</button></header>
<main><div class="titlebar"><div><h1>Quadros</h1><p>Arraste quadros e controles para organizar do seu jeito.</p></div></div><div id="board" class="board"></div></main>
<nav><button class="active">▦<br>Quadros</button><button>◷<br>Histórico</button><button>▥<br>Relatórios</button><button>•••<br>Mais</button></nav>
</div>
<div id="detailModal" class="modal"><div class="panel"><div class="panelhead"><div><h2 id="dTitle"></h2><div id="dParty" class="party"></div></div><button class="x" onclick="closeModal('detailModal')">×</button></div><div id="stats" class="stats"></div><div class="content"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pagamento</th><th>Saldo após</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><button class="btn" onclick="closeModal('detailModal')">Fechar</button><button class="btn primary" onclick="newEntry()">+ Novo lançamento</button></div></div></div>
<div id="formModal" class="modal"><div class="panel"><div class="panelhead"><h2 id="fTitle">Lançamento</h2><button class="x" onclick="closeModal('formModal')">×</button></div><div></div><div id="formBody" class="formgrid"></div><div class="foot"><button class="btn" onclick="closeModal('formModal')">Cancelar</button><button class="btn primary" id="saveBtn">Salvar</button></div></div></div>
<script>
const KEY='meus-controles-github-v1';
const seedEntries=[
['2024-11','PAG. 1ª PARCELA',13000],['2025-01','PAG. 2ª PARCELA',13000],['2025-01','PAG. 3ª PARCELA',13000],['2025-02','PARCELA 4 - CAMINHONETA',30000],['2025-03','50% DO FATURAMENTO SAFRA',56315.79],['2025-04','PARCELA NA SAFRA 25',13157.89],['2025-05','PARCELA NA SAFRA 25',13157.89],['2025-04','IPVA / LANÇAMENTO',3363.90],['2025-04','LOCALIZADOR / RASTREADOR',892.96],['2025-05','BATERIA',700],['2025-05','ELETRICISTA - CAIXA BATERIA',1380],['2025-05','ELETRICISTA - SENSOR VELOCIDADE',1240],['2025-06','DEPÓSITO PRO PAULO',2500],['2025-06','DEPÓSITO JONAS',7180],['2025-08','DEPÓSITO JONAS',13000],['2025-08','DEP. GUINCHO R$ 540',1070.82],['2025-09','DEPÓSITO JONAS',5000],['2025-09','DEPÓSITO ZANETTI PRO JONAS',10000],['2025-10','DEPÓSITO ZANETTI PRO JONAS',10000.75],['2025-11','DEPÓSITO ZANETTI PRO JONAS',10000],['2026-01','PARCELA IPVA 540',581.79],['2026-01','BOLETO PARABRISA 540 PAULO',1100],['2026-01','IPVA 540',572.25],['2026-02','4 PNEUS COM RODA',8000],['2026-02','FRETE NIVELADORA',5000],['2026-02','2 PNEUS PRO MARCO',3000],['2026-02','1 IPVA 540',572.25],['2026-03','SEGURO 540',1400],['2026-04','DESCONTO DO SAFRA',50000]];
function initial(){return {boards:[{id:'b1',name:'Transportes',color:'#3b82f6'}],controls:[{id:'c1',boardId:'b1',name:'PAGAMENTO DA VAN',from:'Van',to:'Você',unit:'R$',initial:650000,entries:seedEntries.map((e,i)=>({id:'e'+(i+1),date:e[0],desc:e[1],category:'Pagamento / abatimento',value:e[2]}))}]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){db=initial()} let current='c1', editing=null;
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function paid(c){return c.entries.reduce((s,e)=>s+Number(e.value||0),0)} function balance(c){return c.initial-paid(c)}
function render(){const q=document.querySelector('#search').value.toLowerCase();const root=document.querySelector('#board');root.innerHTML='';db.boards.forEach((b,bi)=>{let el=document.createElement('section');el.className='column';el.draggable=true;el.dataset.id=b.id;el.innerHTML='<div class="colhead"><span class="dot" style="background:'+b.color+'"></span><strong>'+esc(b.name)+'</strong><span class="count">'+db.controls.filter(c=>c.boardId===b.id).length+'</span><button class="more" title="Excluir quadro" onclick="event.stopPropagation();deleteBoard(\''+b.id+'\')">⋮</button></div><div class="cards"></div><button class="add" onclick="newControl(\''+b.id+'\')">+ Adicionar controle</button>';let cards=el.querySelector('.cards');db.controls.filter(c=>c.boardId===b.id&&c.name.toLowerCase().includes(q)).forEach(c=>{let p=paid(c),bal=balance(c),pct=Math.min(100,Math.max(0,p/c.initial*100));let x=document.createElement('article');x.className='card';x.draggable=true;x.dataset.cid=c.id;x.innerHTML='<div class="cardtop"><h3>'+esc(c.name)+'</h3><span class="pill">'+c.entries.length+' lanç.</span></div><div class="party">'+esc(c.from)+' → '+esc(c.to)+'</div><div class="label">Saldo restante</div><div class="balance">'+money(bal)+'</div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="meta"><span>'+money(p)+' abatidos</span><span>'+pct.toFixed(1).replace('.',',')+'%</span></div>';x.onclick=()=>openDetail(c.id);x.ondragstart=e=>{e.stopPropagation();e.dataTransfer.setData('control',c.id);x.classList.add('dragging')};x.ondragend=()=>x.classList.remove('dragging');cards.appendChild(x)});cards.ondragover=e=>e.preventDefault();cards.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('control');if(id){db.controls.find(c=>c.id===id).boardId=b.id;save();render()}};el.ondragstart=e=>{if(e.target===el){e.dataTransfer.setData('board',b.id);el.classList.add('dragging')}};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{let id=e.dataTransfer.getData('board');if(id&&id!==b.id){let a=db.boards.findIndex(x=>x.id===id),z=db.boards.findIndex(x=>x.id===b.id);let [m]=db.boards.splice(a,1);db.boards.splice(z,0,m);save();render()}};root.appendChild(el)})}
function openDetail(id){current=id;let c=db.controls.find(x=>x.id===id);document.querySelector('#dTitle').textContent=c.name;document.querySelector('#dParty').textContent=c.from+' → '+c.to;let p=paid(c),bal=balance(c);document.querySelector('#stats').innerHTML=stat('Valor inicial',money(c.initial))+stat('Total abatido',money(p))+stat('Saldo atual',money(bal))+stat('Lançamentos',c.entries.length);let running=c.initial;document.querySelector('#rows').innerHTML=c.entries.map(e=>{running-=e.value;return '<tr><td>'+esc(e.date)+'</td><td>'+esc(e.desc)+'</td><td>'+esc(e.category||'Pagamento')+'</td><td class="money">'+money(e.value)+'</td><td class="money">'+money(running)+'</td><td><div class="actions"><button class="mini" onclick="event.stopPropagation();editEntry(\''+e.id+'\')">Editar</button><button class="mini del" onclick="event.stopPropagation();deleteEntry(\''+e.id+'\')">Excluir</button></div></td></tr>'}).join('');document.querySelector('#detailModal').classList.add('open')}
function stat(a,b){return '<div class="stat"><span class="label">'+a+'</span><b>'+b+'</b></div>'}
function newEntry(){editing=null;entryForm({date:new Date().toISOString().slice(0,7),desc:'',category:'Pagamento / abatimento',value:''})}
function editEntry(id){let c=db.controls.find(x=>x.id===current),e=c.entries.find(x=>x.id===id);editing=id;entryForm(e)}
function entryForm(e){document.querySelector('#fTitle').textContent=editing?'Editar lançamento':'Novo lançamento';document.querySelector('#formBody').innerHTML=field('Data','date','month',e.date)+field('Descrição','desc','text',e.desc,'span2')+field('Categoria','category','text',e.category)+field('Valor','value','number',e.value);document.querySelector('#saveBtn').onclick=()=>{let c=db.controls.find(x=>x.id===current),obj={id:editing||'e'+Date.now(),date:v('date'),desc:v('desc'),category:v('category'),value:Number(v('value'))};if(!obj.desc||!obj.value)return alert('Preencha descrição e valor.');if(editing){let old=c.entries.find(x=>x.id===editing);if(!confirm('Confirmar alterações?\n\nValor anterior: '+money(old.value)+'\nNovo valor: '+money(obj.value)))return;Object.assign(old,obj)}else c.entries.push(obj);save();closeModal('formModal');openDetail(current);render()};document.querySelector('#formModal').classList.add('open')}
function field(label,id,type,val,cl=''){return '<div class="field '+cl+'"><label>'+label+'</label><input id="f_'+id+'" type="'+type+'" value="'+esc(String(val??''))+'" step="0.01"></div>'}
function v(id){return document.querySelector('#f_'+id).value}
function deleteEntry(id){let c=db.controls.find(x=>x.id===current),e=c.entries.find(x=>x.id===id);if(confirm('Excluir este lançamento?\n\n'+e.desc+'\n'+money(e.value)+'\n\nEsta ação não pode ser desfeita.')){c.entries=c.entries.filter(x=>x.id!==id);save();openDetail(current);render()}}
function newBoard(){let n=prompt('Nome do novo quadro:');if(n){db.boards.push({id:'b'+Date.now(),name:n,color:'#7c3aed'});save();render()}}
function deleteBoard(id){let b=db.boards.find(x=>x.id===id),cs=db.controls.filter(c=>c.boardId===id);if(!confirm('Excluir o quadro “'+b.name+'”?'+(cs.length?'\n\nEle contém '+cs.length+' controle(s). Os controles serão movidos para outro quadro.':'')))return;if(db.boards.length===1)return alert('Crie outro quadro antes de excluir este.');let dest=db.boards.find(x=>x.id!==id);cs.forEach(c=>c.boardId=dest.id);db.boards=db.boards.filter(x=>x.id!==id);save();render()}
function newControl(boardId){let name=prompt('Nome do controle:');if(!name)return;let initialValue=Number(prompt('Valor inicial/meta:','0')||0);db.controls.push({id:'c'+Date.now(),boardId:boardId||db.boards[0].id,name,from:'Origem',to:'Destino',unit:'R$',initial:initialValue,entries:[]});save();render()}
function closeModal(id){document.querySelector('#'+id).classList.remove('open')} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.querySelector('#search').oninput=render;save();render();
</script></body></html>
